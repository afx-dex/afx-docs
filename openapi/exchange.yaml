openapi: 3.0.3
info:
  title: AFX DEX Exchange API
  version: 1.0.0
  description: |
    All trading operations are submitted through `POST /api/v1/exchange`, routed by `action.type`.
    Every request must include an EIP-712 signature. See the **Signature** page for details.

    JavaScript and Python snippets in this Exchange API reference show the action shape and SDK flow. Full Builder Code examples link to the official JavaScript and Python SDK repositories.

    Common signed request fields:
    - `nonce`: `uint64` Unix timestamp in milliseconds. Use the current millisecond timestamp and do not reuse the same nonce for another signed request.
    - `expiryAfter`: optional `uint64` Unix timestamp in milliseconds. The request expires after this timestamp; `null` means no expiry and must be signed as `0`.

servers:
  - url: https://api.afx.xyz
    description: Mainnet
  - url: https://api-testnet.afx.xyz
    description: Testnet

tags:
  - name: Builder Code
    description: |
      Builder Code lets a registered Builder place orders for a Trader after the Trader explicitly authorizes that Builder's agent wallet. The Builder never receives the Trader's private key.

      **Integration flow:**
      1. The Builder master wallet calls `registerBuilder` once.
      2. Each Trader master wallet calls `approveAgentToBuilder` with the Builder agent address and fee cap.
      3. The Builder agent calls `placeBuilderOrder` or `placeBuilderBracketOrder` for that Trader.
      4. The Trader master wallet calls `revokeAgentToBuilder` to end the authorization.

      **Start here:** [Python full lifecycle example](https://github.com/afx-dex/afx-python-sdk/blob/main/examples/exchange/builder_lifecycle.py) · [JavaScript full lifecycle example](https://github.com/afx-dex/afx-js-sdk/blob/main/examples/exchange/builder-lifecycle.ts).

      Use the SDKs unless you need a raw REST integration. The SDKs create protobuf bytes and EIP-712 signatures for you.

paths:
  # ═══════════════════════════════════════════════════════════════════
  #  Orders
  # ═══════════════════════════════════════════════════════════════════
  /exchange/placeOrder:
    post:
      operationId: placeOrder
      summary: Place Order
      tags: [Orders]
      description: |
        Submit one or more orders. Supports limit, market, and conditional (TP/SL) orders.

        **Signature:** Agent · **Protobuf:** `MsgPlaceOrders`

        **Outer request fields:**
        - `nonce`: `uint64` Unix timestamp in milliseconds. Use the current millisecond timestamp and do not reuse the same nonce for another signed request.
        - `expiryAfter`: optional `uint64` Unix timestamp in milliseconds. The request expires after this timestamp; `null` means no expiry and must be signed as `0`.

        ```protobuf
        message MsgPlaceOrder {
          int64  cl_ord_id           = 1;
          int64  symbol_code         = 2;
          string ord_px              = 3;
          string ord_qty             = 4;
          string trigger_px          = 5;
          OrdType                   ord_type           = 6;
          OrdSide                   ord_side           = 7;
          OrdTIF                    time_in_force      = 8;
          ReduceOnlyOption          reduce_only_option = 9;
          int64  parent_ord_id      = 10;
          ConditionalOrdTriggerType tpsl_trigger_type  = 11;
          string slippage_pct       = 12;
        }
        message MsgPlaceOrders {
          repeated MsgPlaceOrder orders = 1;
        }
        ```

        **Enum Reference:**
        | Enum | Values |
        |------|--------|
        | OrdType | LIMIT=1, MARKET=2 |
        | OrdSide | BUY=1, SELL=2, BUY_CLOSE_HEDGE=3, SELL_CLOSE_HEDGE=4 |
        | OrdTIF | GTC=1, IOC=2, FOK=3, POST_ONLY=4 |
        | ReduceOnlyOption | REDUCE_ONLY=1, TP_FROM_POSITION=2, SL_FROM_POSITION=3 |
        | ConditionalOrdTriggerType | LAST_PRICE=1, MARK_PRICE=2, INDEX_PRICE=3 |

        `NONE` is the proto default value. `MARKET_LIQ_SELLOFF`, `LIMIT_LIQ_SELLOFF`, `ADL`, and `LIQUIDATION` are display-only `OrdType` values used by query or stream data. Do not send those values in order requests.

        `slippagePct` is a decimal ratio string for market orders. For example, `"0.001"` means 0.1%, `"0.01"` means 1%, and `"0.05"` means 5%. Check each product's `maxSlippagePct` from `GET /info/public/product-meta`.

        Field names differ by layer:

        | Concept | Python SDK | Protobuf | REST action |
        |---------|------------|----------|-------------|
        | Symbol code | `symbol_code` | `symbol_code` | `symbolCode` |
        | Order price | `px` | `ord_px` | `ordPx` |
        | Order quantity | `qty` | `ord_qty` | `ordQty` |
        | Reduce-only option | `reduce_only_option` | `reduce_only_option` | `reduceOnlyOption` |
        | Trigger type | `trigger_type` | `tpsl_trigger_type` | `tpslTriggerType` |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
            examples:
              limitOrder:
                summary: Limit Buy
                value:
                  action:
                    type: placeOrder
                    orders:
                      - symbolCode: 1
                        ordPx: "40000.5"
                        ordQty: "0.5"
                        ordType: LIMIT
                        ordSide: BUY
                        timeInForce: GTC
                  signature: { r: "0x...", s: "0x...", v: 27 }
                  nonce: 1763023626904
              marketOrder:
                summary: Market Buy
                value:
                  action:
                    type: placeOrder
                    orders:
                      - symbolCode: 1
                        ordPx: "0"
                        ordQty: "0.1"
                        ordType: MARKET
                        ordSide: BUY
                        timeInForce: IOC
                        slippagePct: "0.01"
                  signature: { r: "0x...", s: "0x...", v: 27 }
                  nonce: 1763023626904
              stopLoss:
                summary: Stop Loss
                value:
                  action:
                    type: placeOrder
                    orders:
                      - symbolCode: 1
                        ordPx: "0"
                        ordQty: "0"
                        ordType: MARKET
                        ordSide: SELL
                        timeInForce: IOC
                        reduceOnlyOption: SL_FROM_POSITION
                        triggerPx: "38000"
                        tpslTriggerType: LAST_PRICE
                        slippagePct: "0.01"
                  signature: { r: "0x...", s: "0x...", v: 27 }
                  nonce: 1763023626904
      responses:
        "200":
          $ref: "#/components/responses/ExchangeOk"
      x-codeSamples:
        - lang: JavaScript
          label: JavaScript pseudocode
          source: |
            // Limit buy
            const result = await client.placeOrder({
              symbolCode: 1, px: "40000.5", qty: "0.5",
              side: "BUY", ordType: "LIMIT", tif: "GTC",
            });
            console.log(result);

            // Market buy
            const result2 = await client.placeOrder({
              symbolCode: 1, px: "0", qty: "0.1",
              side: "BUY", ordType: "MARKET", tif: "IOC",
              slippagePct: "0.01",
            });

            // Stop loss
            const result3 = await client.placeOrder({
              symbolCode: 1, px: "0", qty: "0",
              side: "SELL", ordType: "MARKET", tif: "IOC",
              reduceOnlyOption: "SL_FROM_POSITION",
              triggerPx: "38000", tpslTriggerType: "LAST_PRICE",
              slippagePct: "0.01",
            });
        - lang: Python
          label: Python
          source: |
            from afx import AfxClient

            client = AfxClient.from_env(testnet=True)

            # Limit buy
            result = client.exchange.place_order(
                symbol_code=1, px="40000.5", qty="0.5",
                side="BUY", ord_type="LIMIT", tif="GTC",
            )
            print(result)

            # Market buy
            result2 = client.exchange.place_order(
                symbol_code=1, px="0", qty="0.1",
                side="BUY", ord_type="MARKET", tif="IOC",
                slippage_pct="0.01",
            )

  /exchange/replaceOrder:
    post:
      operationId: replaceOrder
      summary: Replace Order
      tags: [Orders]
      description: |
        Replace an existing order by `ordId` or `clOrdId`.

        **Signature:** Agent · **Protobuf:** `MsgReplaceOrder`

        ```protobuf
        message MsgReplaceOrder {
          int64  cl_ord_id           = 1;
          int64  symbol_code         = 2;
          string ord_px              = 3;
          string ord_qty             = 4;
          string trigger_px          = 5;
          OrdType                   ord_type           = 6;
          OrdSide                   ord_side           = 7;
          OrdTIF                    time_in_force      = 8;
          ReduceOnlyOption          reduce_only_option = 9;
          int64  parent_ord_id      = 10;
          ConditionalOrdTriggerType tpsl_trigger_type  = 11;
          string slippage_pct       = 12;
          int64  ord_id             = 13;
        }
        ```

        At least one of `ordId` or `clOrdId` must identify the existing order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceOrderRequest"
            examples:
              byClOrdId:
                summary: Replace by client order ID
                value:
                  action:
                    type: replaceOrder
                    symbolCode: 1
                    ordPx: "50100"
                    ordQty: "0.001"
                    ordType: LIMIT
                    ordSide: BUY
                    timeInForce: GTC
                    clOrdId: 99001
                  signature: { r: "0x...", s: "0x...", v: 27 }
                  nonce: 1763023626904
      responses:
        "200":
          $ref: "#/components/responses/ExchangeOk"
      x-codeSamples:
        - lang: JavaScript
          label: JavaScript pseudocode
          source: |
            await client.replaceOrder({
              symbolCode: 1,
              px: "50100",
              qty: "0.001",
              side: "BUY",
              ordType: "LIMIT",
              tif: "GTC",
              clOrdId: 99001,
            });
        - lang: Python
          label: Python (afx-python-sdk)
          source: |
            import time

            from afx import AfxClient

            client = AfxClient.from_env(testnet=True)
            cl_ord_id = int(time.time() * 1000)

            client.exchange.place_order(
                symbol_code=1,
                px="50000",
                qty="0.001",
                side="BUY",
                ord_type="LIMIT",
                tif="GTC",
                cl_ord_id=cl_ord_id,
            )

            result = client.exchange.replace_order(
                symbol_code=1,
                px="50100",
                qty="0.001",
                side="BUY",
                ord_type="LIMIT",
                tif="GTC",
                cl_ord_id=cl_ord_id,
            )
            print(result)

            # Full example:
            # https://github.com/afx-dex/afx-python-sdk/blob/main/examples/exchange/replace_order.py

  /exchange/placeBracketOrder:
    post:
      operationId: placeBracketOrder
      summary: Place Bracket Order
      tags: [Orders]
      description: |
        Place a main order with one or two attached TP/SL child orders.

        **Signature:** Agent · **Protobuf:** `MsgPlaceBracketOrder`

        ```protobuf
        message MsgPlaceBracketOrder {
          MsgPlaceOrder main_order        = 1;
          MsgPlaceOrder take_profit_order = 2;
          MsgPlaceOrder stop_loss_order   = 3;
        }
        ```

        The request must contain 2 or 3 orders. The first order is the main order. Child orders must use `reduceOnly` as `TP_FROM_POSITION` or `SL_FROM_POSITION`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceBracketOrderRequest"
            examples:
              withTakeProfitAndStopLoss:
                summary: Main limit order with TP and SL
                value:
                  action:
                    type: placeBracketOrder
                    orders:
                      - symbolCode: 1
                        ordPx: "50000"
                        ordQty: "0.001"
                        ordType: LIMIT
                        ordSide: BUY
                        timeInForce: GTC
                        clOrdId: 99001
                      - symbolCode: 1
                        ordPx: "55000"
                        ordQty: "0.001"
                        triggerPx: "55000"
                        ordType: LIMIT
                        ordSide: SELL
                        timeInForce: GTC
                        reduceOnly: TP_FROM_POSITION
                        tpslTriggerType: LAST_PRICE
                        clOrdId: 99002
                      - symbolCode: 1
                        ordPx: "0"
                        ordQty: "0.001"
                        triggerPx: "45000"
                        ordType: MARKET
                        ordSide: SELL
                        timeInForce: IOC
                        reduceOnly: SL_FROM_POSITION
                        tpslTriggerType: LAST_PRICE
                        slippagePct: "0.01"
                        clOrdId: 99003
                  signature: { r: "0x...", s: "0x...", v: 27 }
                  nonce: 1763023626904
      responses:
        "200":
          $ref: "#/components/responses/ExchangeOk"
      x-codeSamples:
        - lang: JavaScript
          label: JavaScript pseudocode
          source: |
            await client.placeBracketOrder({
              orders: [
                {
                  symbolCode: 1, px: "50000", qty: "0.001",
                  side: "BUY", ordType: "LIMIT", tif: "GTC",
                  clOrdId: 99001,
                },
                {
                  symbolCode: 1, px: "55000", qty: "0.001",
                  triggerPx: "55000", side: "SELL",
                  ordType: "LIMIT", tif: "GTC",
                  reduceOnly: "TP_FROM_POSITION",
                  tpslTriggerType: "LAST_PRICE",
                  clOrdId: 99002,
                },
                {
                  symbolCode: 1, px: "0", qty: "0.001",
                  triggerPx: "45000", side: "SELL",
                  ordType: "MARKET", tif: "IOC",
                  reduceOnly: "SL_FROM_POSITION",
                  tpslTriggerType: "LAST_PRICE",
                  slippagePct: "0.01",
                  clOrdId: 99003,
                },
              ],
            });
        - lang: Python
          label: Python (afx-python-sdk)
          source: |
            import time

            from afx import AfxClient

            client = AfxClient.from_env(testnet=True)
            base_cl_ord_id = int(time.time() * 1000)

            result = client.exchange.place_bracket_order(
                main_order={
                    "symbol_code": 1,
                    "px": "50000",
                    "qty": "0.001",
                    "side": "BUY",
                    "ord_type": "LIMIT",
                    "tif": "GTC",
                    "cl_ord_id": base_cl_ord_id,
                },
                take_profit_order={
                    "symbol_code": 1,
                    "px": "55000",
                    "qty": "0.001",
                    "trigger_px": "55000",
                    "side": "SELL",
                    "ord_type": "LIMIT",
                    "tif": "GTC",
                    "reduce_only_option": "TP_FROM_POSITION",
                    "trigger_type": "LAST_PRICE",
                    "cl_ord_id": base_cl_ord_id + 1,
                },
                stop_loss_order={
                    "symbol_code": 1,
                    "px": "0",
                    "qty": "0.001",
                    "trigger_px": "45000",
                    "side": "SELL",
                    "ord_type": "MARKET",
                    "tif": "IOC",
                    "reduce_only_option": "SL_FROM_POSITION",
                    "trigger_type": "LAST_PRICE",
                    "slippage_pct": "0.01",
                    "cl_ord_id": base_cl_ord_id + 2,
                },
            )
            print(result)

            # Full example:
            # https://github.com/afx-dex/afx-python-sdk/blob/main/examples/exchange/place_bracket_order.py

  /exchange/cancelOrder:
    post:
      operationId: cancelOrder
      summary: Cancel Order
      tags: [Orders]
      description: |
        Cancel one or more orders by orderId or clOrdId.

        **Signature:** Agent · **Protobuf:** `MsgCancelOrders`

        **Outer request fields:**
        - `nonce`: `uint64` Unix timestamp in milliseconds. Use the current millisecond timestamp and do not reuse the same nonce for another signed request.

        ```protobuf
        message MsgCancelOrder {
          int64 symbol_code = 1;
          int64 cl_ord_id   = 2;
          int64 ord_id      = 3;
        }
        message MsgCancelOrders {
          repeated MsgCancelOrder orders = 1;
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
            examples:
              byOrdId:
                summary: Cancel by orderId
                value:
                  action:
                    type: cancelOrder
                    cancels:
                      - symbolCode: 1
                        ordId: "12345"
                  signature: { r: "0x...", s: "0x...", v: 27 }
                  nonce: 1763023626904
              byClOrdId:
                summary: Cancel by clOrdId
                value:
                  action:
                    type: cancelOrder
                    cancels:
                      - symbolCode: 1
                        clOrdId: "99001"
                  signature: { r: "0x...", s: "0x...", v: 27 }
                  nonce: 1763023626904
      responses:
        "200":
          $ref: "#/components/responses/ExchangeOk"
      x-codeSamples:
        - lang: JavaScript
          label: JavaScript pseudocode
          source: |
            // Cancel by system order ID
            await client.cancelOrder({ symbolCode: 1, ordId: "12345" });

            // Cancel by client order ID
            await client.cancelOrder({ symbolCode: 1, clOrdId: "99001" });
        - lang: Python
          label: Python
          source: |
            # Cancel by system order ID
            client.exchange.cancel_order(symbol_code=1, ord_id="12345")

            # Cancel by client order ID
            client.exchange.cancel_order(symbol_code=1, cl_ord_id="99001")

  /exchange/cancelAll:
    post:
      operationId: cancelAll
      summary: Cancel All Orders
      tags: [Orders]
      description: |
        Cancel all orders for a symbol.

        **Signature:** Agent · **Protobuf:** `MsgCancelAll`

        **Outer request fields:**
        - `nonce`: `uint64` Unix timestamp in milliseconds. Use the current millisecond timestamp and do not reuse the same nonce for another signed request.

        ```protobuf
        message MsgCancelAll {
          int64 symbol_code          = 1;
          bool  is_conditional_order = 2;
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAllRequest"
            examples:
              default:
                value:
                  action:
                    type: cancelAll
                    symbolCode: 1
                    conditionalOrder: false
                  signature: { r: "0x...", s: "0x...", v: 27 }
                  nonce: 1763023626904
      responses:
        "200":
          $ref: "#/components/responses/ExchangeOk"
      x-codeSamples:
        - lang: JavaScript
          label: JavaScript pseudocode
          source: |
            await client.cancelAll({ symbolCode: 1 });

            // Cancel conditional orders only
            await client.cancelAll({ symbolCode: 1, conditional: true });
        - lang: Python
          label: Python
          source: |
            client.exchange.cancel_all(symbol_code=1)

            # Cancel conditional orders only
            client.exchange.cancel_all(symbol_code=1, conditional=True)

  # ═══════════════════════════════════════════════════════════════════
  #  Account Settings
  # ═══════════════════════════════════════════════════════════════════
  /exchange/setLeverage:
    post:
      operationId: setLeverage
      summary: Set Leverage
      tags: [Account]
      description: |
        Set leverage for a symbol.

        **Signature:** Agent · **Protobuf:** `MsgSetLeverage`

        ```protobuf
        message MsgSetLeverage {
          int64  symbol_code = 1;
          string leverage    = 2;
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLeverageRequest"
            examples:
              default:
                value:
                  action:
                    type: setLeverage
                    symbolCode: 1
                    leverage: "10"
                  signature: { r: "0x...", s: "0x...", v: 27 }
                  nonce: 1763023626904
      responses:
        "200":
          $ref: "#/components/responses/ExchangeOk"
      x-codeSamples:
        - lang: JavaScript
          label: JavaScript pseudocode
          source: |
            await client.setLeverage({ symbolCode: 1, leverage: "10" });
        - lang: Python
          label: Python
          source: |
            client.exchange.set_leverage(symbol_code=1, leverage="10")

  /exchange/setMarginMode:
    post:
      operationId: setMarginMode
      summary: Set Margin Mode
      tags: [Account]
      description: |
        Set margin mode for a symbol.

        **Signature:** Agent · **Protobuf:** `MsgSetMarginMode`

        ```protobuf
        message MsgSetMarginMode {
          int64              symbol_code = 1;
          PositionMarginMode margin_mode = 2;  // CROSS=1, ISOLATED=2
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMarginModeRequest"
            examples:
              default:
                value:
                  action:
                    type: setMarginMode
                    symbolCode: 1
                    marginMode: CROSS
                  signature: { r: "0x...", s: "0x...", v: 27 }
                  nonce: 1763023626904
      responses:
        "200":
          $ref: "#/components/responses/ExchangeOk"
      x-codeSamples:
        - lang: JavaScript
          label: JavaScript pseudocode
          source: |
            await client.setMarginMode({ symbolCode: 1, mode: "CROSS" });
        - lang: Python
          label: Python
          source: |
            client.exchange.set_margin_mode(symbol_code=1, mode="CROSS")

  /exchange/assignPosMargin:
    post:
      operationId: assignPosMargin
      summary: Assign Position Margin
      tags: [Account]
      description: |
        Add or remove margin for an isolated position.

        **Signature:** Agent · **Protobuf:** `MsgAssignPosMargin`

        ```protobuf
        message MsgAssignPosMargin {
          int64  symbol_code        = 1;
          string assigned_pos_margin = 2;
        }
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignPosMarginRequest"
            examples:
              default:
                value:
                  action:
                    type: assignPosMargin
                    symbolCode: 1
                    assignedPosMargin: "100"
                  signature: { r: "0x...", s: "0x...", v: 27 }
                  nonce: 1763023626904
      responses:
        "200":
          $ref: "#/components/responses/ExchangeOk"
      x-codeSamples:
        - lang: JavaScript
          label: JavaScript pseudocode
          source: |
            await client.assignPosMargin({ symbolCode: 1, amount: "100" });
        - lang: Python
          label: Python
          source: |
            client.exchange.assign_pos_margin(symbol_code=1, amount="100")

  # ═══════════════════════════════════════════════════════════════════
  #  Master Signature Operations
  # ═══════════════════════════════════════════════════════════════════
  /exchange/approveAgent:
    post:
      operationId: approveAgent
      summary: Approve Agent
      tags: [Authorization]
      description: |
        Authorize an Agent wallet to trade on behalf of the Master wallet.

        **Signature:** Master · **No protobuf** — fields are signed directly via EIP-712.

        To revoke the current Agent wallet, submit the same `approveAgent` action with `agentAddress` set to `0x0000000000000000000000000000000000000000` and `validitySeconds` set to `0`. The Python SDK exposes this as `client.exchange.revoke_agent(...)`.

        **EIP-712 type:**
        ```json
        {
          "ApproveAgent": [
            { "name": "dexChain",     "type": "string"  },
            { "name": "agentAddress", "type": "address" },
            { "name": "agentName",    "type": "string"  },
            { "name": "validitySeconds", "type": "uint64" },
            { "name": "nonce",        "type": "uint64"  },
            { "name": "expiryAfter",  "type": "uint64"  }
          ]
        }
        ```
        `validitySeconds` is the agent authorization duration. `0` means the authorization is valid for 7 days; maximum 365 days.
        Domain name: `"SignTransaction"`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveAgentRequest"
            examples:
              default:
                value:
                  action:
                    type: approveAgent
                    agentAddress: "0x76b6c4dc45f39463a1c8f6500c94b247c53fe184"
                    agentName: "my-trading-bot"
                    validitySeconds: 604800
                    dexChain: "Mainnet"
                  signature: { r: "0x...", s: "0x...", v: 27 }
                  nonce: 1763023626904
                  expiryAfter: 1763023686904
      responses:
        "200":
          $ref: "#/components/responses/ExchangeOk"
      x-codeSamples:
        - lang: JavaScript
          label: JavaScript pseudocode
          source: |
            await client.approveAgent({ agentName: "my-trading-bot", validitySeconds: 604800 });
        - lang: Python
          label: Python
          source: |
            client.exchange.approve_agent(agent_name="my-trading-bot", validity_seconds=604800)

            # Revoke the active agent wallet.
            client.exchange.revoke_agent(agent_name="my-trading-bot")

  /exchange/revokeAgent:
    post:
      operationId: revokeAgent
      summary: Revoke Agent
      tags: [Authorization]
      description: |
        Revoke the currently approved Agent wallet.

        **Signature:** Master · **No protobuf** — fields are signed directly via EIP-712.

        Revocation uses the same `approveAgent` action with `agentAddress` set to `0x0000000000000000000000000000000000000000` and `validitySeconds` set to `0`.

        Use this operation when rotating Agent keys, stopping an automated strategy, or responding to suspected Agent key exposure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveAgentRequest"
            examples:
              default:
                value:
                  action:
                    type: approveAgent
                    agentAddress: "0x0000000000000000000000000000000000000000"
                    agentName: "my-trading-bot"
                    validitySeconds: 0
                    dexChain: "Mainnet"
                  signature: { r: "0x...", s: "0x...", v: 27 }
                  nonce: 1763023626904
                  expiryAfter: 1763023686904
      responses:
        "200":
          $ref: "#/components/responses/ExchangeOk"
      x-codeSamples:
        - lang: Python
          label: Python
          source: |
            client.exchange.revoke_agent(agent_name="my-trading-bot")

  /exchange/withdraw:
    post:
      operationId: withdraw
      summary: Withdraw
      tags: [Authorization]
      description: |
        Withdraw funds from DEX to an external address.

        **Signature:** Master · **No protobuf**

        **EIP-712 type:**
        ```json
        {
          "Withdraw": [
            { "name": "dexChain",    "type": "string"  },
            { "name": "destination", "type": "address" },
            { "name": "amount",      "type": "string"  },
            { "name": "withdrawSequence", "type": "uint64" },
            { "name": "nonce",       "type": "uint64"  },
            { "name": "expiryAfter", "type": "uint64"  }
          ]
        }
        ```
        Domain name: `"SignTransaction"`. `dexChain` is determined by the server environment. `withdrawSequence` is included in both the action body and the signed EIP-712 message. If omitted in the Python SDK, it defaults to the request `nonce`.

        For withdrawals, use a longer `expiryAfter` window, such as current Unix time in milliseconds + 3,600,000.
        The minimum mainnet withdrawal amount is 2 USDC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawRequest"
            examples:
              default:
                value:
                  action:
                    type: withdraw
                    destination: "0xabc123..."
                    amount: "100"
                    withdrawSequence: 1763023626904
                  signature: { r: "0x...", s: "0x...", v: 27 }
                  nonce: 1763023626904
                  expiryAfter: 1763027226904
      responses:
        "200":
          $ref: "#/components/responses/ExchangeOk"
      x-codeSamples:
        - lang: JavaScript
          label: JavaScript pseudocode
          source: |
            await client.withdraw({ destination: "0xabc...", amount: "100", expirySeconds: 3600 });
        - lang: Python
          label: Python
          source: |
            client.exchange.withdraw(destination="0xabc...", amount="100", expiry_seconds=3600)

